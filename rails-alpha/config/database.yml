<%
require "json"
require Rails.root.join("config", "staging", "persistence").to_s
StagingPersistence.validate!(Rails.env)
%>
default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000
development:
  <<: *default
  database: storage/development.sqlite3
test:
  <<: *default
  database: storage/test.sqlite3
<% if Rails.env.staging? && ENV["RR_STAGING_DB"] == "postgresql" %>
staging: <%= JSON.generate(StagingPersistence.postgresql_config!) %>
<% else %>
staging:
  <<: *default
  database: storage/staging.sqlite3
<% end %>
